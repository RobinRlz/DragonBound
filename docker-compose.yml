services:
  mysql:
    # image: mysql:5.7
    image: mysql:8.0
    container_name: mysql_dragonbound
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      MYSQL_DATABASE: ${DB_DATABASE:-dragonbound}
    ports:
      # Solo accesible desde esta máquina (antes: 0.0.0.0)
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/dragonbound.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - my_private_network
  game:
    build:
      context: .
      dockerfile: game.Dockerfile
    container_name: game_dragonbound
    env_file: .env
    volumes:
      - ./src/game:/app/src/game
    ports:
      - "9001:9001"
    depends_on:
      - mysql
    networks:
      - my_private_network
  web:
    build:
      context: .
      dockerfile: web.Dockerfile
    container_name: web_dragonbound
    env_file: .env
    volumes:
      - ./src/web:/app/src/web
      # La web también usa código del servidor de juego (gametypes, Shoot, base de datos...)
      - ./src/game:/app/src/game
    ports:
      - "80:80"
    depends_on:
      - mysql
      - game
    networks:
      - my_private_network

networks:
  my_private_network:
    driver: bridge

volumes:
  mysql_data:
